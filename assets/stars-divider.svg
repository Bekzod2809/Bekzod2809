<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title">
  <title id="title">Animated violet and cyan stars</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C3AED" stop-opacity="0" />
      <stop offset=".25" stop-color="#8B5CF6" />
      <stop offset=".52" stop-color="#67E8F9" />
      <stop offset=".78" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
  </defs>
  <path d="M80 50 H1120" stroke="url(#line)" stroke-width="2" stroke-dasharray="18 18">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="5s" repeatCount="indefinite" />
  </path>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="180" y="58" fill="#C4B5FD" font-size="25">✦<animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite" /></text>
    <text x="405" y="57" fill="#E0E7FF" font-size="17">✧<animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite" /></text>
    <text x="600" y="59" fill="#67E8F9" font-size="27">✦<animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite" /></text>
    <text x="795" y="57" fill="#E0E7FF" font-size="17">✧<animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite" /></text>
    <text x="1020" y="58" fill="#C4B5FD" font-size="25">✦<animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite" /></text>
  </g>
</svg>
