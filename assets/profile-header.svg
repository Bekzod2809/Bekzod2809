<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bekzod — software developer</title>
  <desc id="desc">A deep navy and violet space-inspired banner with a softly animated constellation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B" />
      <stop offset="0.55" stop-color="#111631" />
      <stop offset="1" stop-color="#17102E" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7C3AED" stop-opacity=".42" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA" />
      <stop offset=".52" stop-color="#E0E7FF" />
      <stop offset="1" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <ellipse cx="275" cy="75" rx="330" ry="210" fill="url(#glow)" filter="url(#soft-glow)" />
  <ellipse cx="1010" cy="300" rx="320" ry="200" fill="url(#glow)" filter="url(#soft-glow)" />

  <g fill="none" stroke="#A78BFA" stroke-opacity=".16">
    <ellipse cx="600" cy="170" rx="470" ry="108" transform="rotate(-9 600 170)" />
    <ellipse cx="600" cy="170" rx="390" ry="78" transform="rotate(8 600 170)" />
  </g>

  <g fill="#E0E7FF">
    <circle cx="92" cy="92" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="215" cy="278" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="2.7s" repeatCount="indefinite" /></circle>
    <circle cx="355" cy="66" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="493" cy="301" r="2"><animate attributeName="opacity" values="1;.25;1" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="746" cy="58" r="1.7"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="888" cy="284" r="2"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite" /></circle>
    <circle cx="1080" cy="96" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite" /></circle>
    <circle cx="1120" cy="244" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite" /></circle>
  </g>

  <circle cx="137" cy="183" r="4" fill="#67E8F9" opacity=".8">
    <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1056" cy="190" r="3" fill="#C4B5FD" opacity=".9">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="3.1s" repeatCount="indefinite" />
  </circle>

  <text x="600" y="145" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="1">Bekzod</text>
  <text x="600" y="198" text-anchor="middle" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">SOFTWARE DEVELOPER</text>
  <text x="600" y="237" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1">.NET  ·  JAVASCRIPT  ·  PYTHON</text>
  <text x="600" y="282" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Building useful APIs and thoughtful web experiences</text>
</svg>
